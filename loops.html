<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // if(exp 1 A; exp 2 B; exp 3 C;) {
        //     code ... D
        // }



        
        for(let i=0; i<condition; i++){
            console.log("Hello World"); // D
        }
        
        condition = 10 // A
        while (condition /*B*/) {
            console.log("Hello World"); // D
            condition--; // C
        }
        // condition = 00 
        do {
            console.log("Hello World");
            condition++;
        } while (condition < 10);
    </script>
</body>
